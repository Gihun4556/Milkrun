#tb{display:none}

td{padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent);text-align:left}

.row{display:flex;align-items:center;gap:10px;font-size:13px;text-align:left}

.row button{font-size:12px;padding:8px 12px;border-radius:10px;min-width:92px}
.row button:disabled{opacity:.4}

</head>
