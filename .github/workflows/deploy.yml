name: Unpack and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zips
        run: |
          rm -rf site server
          unzip -q milkrun-game.zip -d site
          unzip -q milkrun-server.zip -d server
      - name: Save unpacked files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add site server
          git commit -m "Unpack game and server" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: unpack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
